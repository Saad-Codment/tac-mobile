buildscript {
    ext {
        buildToolsVersion = "35.0.0"          // updated
        minSdkVersion = 24
        compileSdkVersion = 36                // ← Important change
        targetSdkVersion = 36                 // ← Also update
ndkVersion = "28.0.12433566"          // ← Upgrade from 27 to 28+ (very important)
        kotlinVersion = "1.9.24" // ✅ FORCE DOWNGRADE
        // kotlinVersion = "1.9.24"
        // ← ADD THIS LINE (or change existing one to this version)
        googlePlayServicesVersion = "21.0.1"     // Important fix
        playServicesLocationVersion = "21.0.1"   // Some people need both
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
classpath("com.android.tools.build:gradle:8.9.1")   // Updated from 8.8.2 or 8.5.x
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://www.jitpack.io' }

        maven {
            url "$rootDir/../node_modules/@notifee/react-native/android/libs"
        }
         maven {
      url 'https://api.mapbox.com/downloads/v2/releases/maven'
      authentication {
        basic(BasicAuthentication)
      }
      credentials {
        username = "mapbox"
        password = project.properties['MAPBOX_DOWNLOADS_TOKEN'] ?: ""
      }
    }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("kotlinOptions")) {
            project.kotlinOptions {
                jvmTarget = "1.8"
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"